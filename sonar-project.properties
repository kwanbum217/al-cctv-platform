# 프로젝트 고유 식별자 및 이름
sonar.projectKey=al-cctv-platform
sonar.projectName=AL CCTV Platform
sonar.projectVersion=1.0

# 분석할 소스 코드 경로 (프로젝트 루트 기준, 쉼표로 구분)
sonar.sources=part01_llm_chatgpt_api,part02_langchain,part03_rag_vectordb,part04_multimodal

# 분석에서 제외할 파일 및 경로 패턴
# venv 가상환경, sqlite/chroma_db, 임시 파일, 미디어 파일 등 제외
sonar.exclusions=venv/**, **/chroma_db/**, **/.antigravitycli/**, **/stderr.log, **/*.pdf, **/*.png, **/*.jpg, **/*.wav, **/*.mp3, **/waves/**, **/briefings_chunks/**, **/*.zip, **/*.log

# 소스 코드 인코딩 및 언어 설정
sonar.sourceEncoding=UTF-8
sonar.language=py
sonar.python.version=3

# 소나큐브 서버 주소 (로컬 서버 기준)
sonar.host.url=http://localhost:19000
sonar.login=admin
sonar.password=admin
